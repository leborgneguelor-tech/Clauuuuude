name: Déployer Voix IA sur GitHub Pages

on:
  push:
    branches:
      - claude/ai-voice-generation-app-jmi84o
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer le contenu du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: voix-ia

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
